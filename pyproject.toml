[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-ep"
version = "0.1.0"
description = "Single-node expert-parallel dispatch and combine for PyTorch"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["torch>=2.10", "ninja>=1.11"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Environment :: GPU :: NVIDIA CUDA",
]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "ruff>=0.14", "build>=1.2", "setuptools>=77", "wheel", "pip>=25"]

[tool.setuptools.packages.find]
include = ["nano_ep*"]
namespaces = false

[tool.setuptools.package-data]
nano_ep = ["py.typed", "_csrc/*.cpp", "_csrc/*.cu", "_csrc/*.hpp", "_csrc/include/nano_ep/*.hpp"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
